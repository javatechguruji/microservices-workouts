apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: gateway-service:stage3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9100
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://host.minikube.internal:4318
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=ecommerce,deployment.environment.name=stage
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9100
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9100
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: ecommerce
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 9100
      targetPort: 9100
