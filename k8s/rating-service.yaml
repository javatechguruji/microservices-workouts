apiVersion: apps/v1
kind: Deployment
metadata:
  name: rating-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rating-service
  template:
    metadata:
      labels:
        app: rating-service
    spec:
      containers:
        - name: rating-service
          image: rating-service:stage6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9108
          env:
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: service-client-credentials
                  key: rating-service
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9108
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9108
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rating-service
  namespace: ecommerce
spec:
  type: ClusterIP
  selector:
    app: rating-service
  ports:
    - name: http
      port: 9108
      targetPort: 9108
