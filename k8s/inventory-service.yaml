apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: ecommerce
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: inventory-service:stage1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9105
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://host.minikube.internal:4318
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=ecommerce,deployment.environment.name=stage
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9105
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9105
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9105
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: ecommerce
spec:
  type: ClusterIP
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 9105
      targetPort: 9105
