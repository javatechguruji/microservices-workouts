# Active when running directly on the Mac (IntelliJ, mvn spring-boot:run).
# Postgres reached via docker-compose's port mapping on localhost — run
# `docker compose up -d` from the repo root first.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order-srv-db
    username: postgres
    password: postgres
  kafka:
    bootstrap-servers: localhost:9092

# order-service calls product-aggregator-service and inventory-service directly by
# hostname:port here; in Kubernetes these become the Service DNS names
# instead of hardcoded localhost URLs (see application-k8s.yml).
# HTTP service calls always return through the gateway.
services:
  gateway-url: http://localhost:9100

security:
  client:
    id: order-service
    secret: ${KEYCLOAK_CLIENT_SECRET:LBOkQHGD24s1Wg7L7Bl4iul03PWxgZ0p7oNR-LMmIQ4}
    token-uri: http://localhost:8180/realms/ecommerce/protocol/openid-connect/token

documentation:
  # Browser-facing gateway address, not internal Kubernetes service DNS.
  gateway-url: ${PUBLIC_GATEWAY_URL:http://localhost:9100}
