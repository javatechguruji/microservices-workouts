spring:
  application:
    name: order-service
  profiles:
    # Overridden by SPRING_PROFILES_ACTIVE=k8s in the Kubernetes Deployment.
    active: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    consumer:
      group-id: order-group
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.tip.ecommerce.order.event
        spring.json.value.default.type: com.tip.ecommerce.order.event.PaymentCompletedEvent
        spring.json.use.type.headers: false
    listener:
      ack-mode: manual

server:
  port: 9091

management:
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.jdbc.datasource: INFO
