# Active inside the cluster via SPRING_PROFILES_ACTIVE=k8s (see
# k8s/order-service.yaml). Postgres runs on the host machine's Docker, NOT
# inside minikube — pods reach the host through minikube's built-in DNS
# alias, not "localhost" (that would resolve to the Pod itself).
spring:
  datasource:
    url: jdbc:postgresql://host.minikube.internal:5432/order-srv-db
    username: postgres
    password: postgres
  kafka:
    # Kafka's PLAINTEXT_K8S listener (port 9094) — see docker-compose.yml.
    bootstrap-servers: host.minikube.internal:9094

# HTTP service calls always return through the gateway.
services:
  gateway-url: http://gateway-service:9100

security:
  client:
    id: order-service
    secret: ${KEYCLOAK_CLIENT_SECRET:}
    token-uri: http://host.minikube.internal:8180/realms/ecommerce/protocol/openid-connect/token

documentation:
  # Browser-facing gateway address, not internal Kubernetes service DNS.
  gateway-url: ${PUBLIC_GATEWAY_URL:http://localhost:9100}
