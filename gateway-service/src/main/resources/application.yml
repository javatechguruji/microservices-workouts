spring:
  application:
    name: gateway-service
  profiles:
    # Overridden by SPRING_PROFILES_ACTIVE=k8s in the Kubernetes Deployment.
    active: local

  cloud:
    gateway:
      routes:
        # order-service's real API already lives at /api/orders/** — no
        # rewrite needed, the gateway just forwards the path as-is.
        - id: order-service
          uri: ${services.order.url}
          predicates:
            - Path=/api/orders/**

server:
  port: 8000

management:
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
