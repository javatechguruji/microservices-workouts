spring:
  application:
    name: gateway-service
  profiles:
    # Used only when no active profile is selected; Kubernetes explicitly selects k8s.
    default: local

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # order-service's real API already lives at /api/orders/** — no
            # rewrite needed, the gateway just forwards the path as-is.
            - id: order-service
              uri: ${services.order.url}
              predicates:
                - Path=/api/orders/**
            - id: payment-service
              uri: ${services.payment.url}
              predicates:
                - Path=/payments/**
            - id: notification-service
              uri: ${services.notification.url}
              predicates:
                - Path=/notifications/**
            - id: product-aggregator-service
              uri: ${services.product.url}
              predicates:
                - Path=/api/products/**
            - id: inventory-service
              uri: ${services.inventory.url}
              predicates:
                - Path=/api/inventory/**

            - id: customer-service
              uri: ${services.customer.url}
              predicates:
                - Path=/api/customers/**
            - id: product-discount-service
              uri: ${services.product-discount.url}
              predicates:
                - Path=/api/discounts/**
            - id: rating-service
              uri: ${services.rating.url}
              predicates:
                - Path=/api/ratings/**

server:
  port: 9100

management:
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.tip.ecommerce: ${APP_LOG_LEVEL:INFO}
  structured:
    format:
      console: logstash
