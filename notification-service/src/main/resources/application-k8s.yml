# Active inside the cluster via SPRING_PROFILES_ACTIVE=k8s (see
# k8s/notification-service.yaml).
spring:
  datasource:
    url: jdbc:postgresql://host.minikube.internal:5432/notification-service-db
    username: postgres
    password: postgres
  sql:
    init:
      mode: always
  kafka:
    # Kafka's PLAINTEXT_K8S listener (port 9094) — see docker-compose.yml.
    bootstrap-servers: host.minikube.internal:9094
