spring:
  application:
    name: notification-service
  profiles:
    # Overridden by SPRING_PROFILES_ACTIVE=k8s in the Kubernetes Deployment.
    active: local

  kafka:
    consumer:
      auto-offset-reset: earliest
      group-id: notification-group
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.tip.ecommerce.notification.event
        spring.json.value.default.type: com.tip.ecommerce.notification.event.PaymentCompletedEvent
        spring.json.use.type.headers: false
    listener:
      ack-mode: manual

server:
  port: 9103

management:
  endpoint:
    health:
      probes:
        enabled: true
