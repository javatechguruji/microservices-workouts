# Java agent reads this file before Spring starts; Spring application.yml is not agent configuration.
# Environment variables override these defaults. Do not add a second tracing SDK/agent.
otel.service.name=product-discount-service
otel.resource.attributes=service.namespace=ecommerce,deployment.environment.name=local
otel.exporter.otlp.endpoint=http://localhost:4318
otel.exporter.otlp.protocol=http/protobuf
otel.traces.exporter=otlp
otel.metrics.exporter=otlp
otel.logs.exporter=otlp
otel.traces.sampler=parentbased_traceidratio
otel.traces.sampler.arg=1.0
otel.propagators=tracecontext,baggage
otel.metric.export.interval=15000
otel.instrumentation.micrometer.enabled=true
# Avoid exporting unbounded SQL values and captured request/response headers.
otel.instrumentation.jdbc.statement-sanitizer.enabled=true
