spring:
  application:
    name: inventory-service
  profiles:
    active: local
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
server:
  port: 9105
management:
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: logstash
