spring:
  application:
    name: rating-service
  profiles:
    active: local
  sql:
    init:
      mode: always
  kafka:
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
server:
  port: 9108
management:
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.tip.ecommerce: ${APP_LOG_LEVEL:INFO}
  structured:
    format:
      console: logstash
