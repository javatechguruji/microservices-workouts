global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: otel-applications
    honor_labels: true
    static_configs:
      - targets: [otel-collector:9464]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
