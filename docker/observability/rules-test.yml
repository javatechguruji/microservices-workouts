rule_files:
  - /etc/prometheus/alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="otel-applications"}'
        values: '0 0 0 0'
      - series: 'commerce_outbox_pending{service_name="order-service"}'
        values: '11 11 11 11 11 11 11'
      - series: 'commerce_checkout_pending{service_name="order-service"}'
        values: '11 11 11 11 11 11 11'
    alert_rule_test:
      - eval_time: 3m
        alertname: TelemetryScrapeDown
        exp_alerts:
          - exp_labels:
              job: otel-applications
              severity: warning
            exp_annotations:
              summary: Telemetry target otel-applications is unreachable
              description: 'Check docker compose ps and logs; missing telemetry is not evidence of a healthy application.'
      - eval_time: 6m
        alertname: OutboxBacklog
        exp_alerts:
          - exp_labels:
              service_name: order-service
              severity: warning
            exp_annotations:
              summary: Unpublished outbox backlog in order-service
              description: 'Inspect publisher logs and Kafka availability. Retries may publish duplicates; consumers must deduplicate.'
      - eval_time: 6m
        alertname: CheckoutBacklog
        exp_alerts:
          - exp_labels:
              service_name: order-service
              severity: warning
            exp_annotations:
              summary: Checkout backlog has more than 10 pending orders
              description: 'Inspect worker retries, inventory/payment availability, and database locks.'
  - interval: 1m
    input_series:
      - series: 'up{job="otel-applications"}'
        values: '1 1 1 1 1 1 1'
      - series: 'commerce_outbox_pending{service_name="order-service"}'
        values: '0 0 0 0 0 0 0'
      - series: 'commerce_checkout_pending{service_name="order-service"}'
        values: '10 10 10 10 10 10 10'
    alert_rule_test:
      - eval_time: 6m
        alertname: TelemetryScrapeDown
        exp_alerts: []
      - eval_time: 6m
        alertname: OutboxBacklog
        exp_alerts: []
      - eval_time: 6m
        alertname: CheckoutBacklog
        exp_alerts: []
