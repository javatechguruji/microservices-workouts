# Infrastructure only: shared by IntelliJ and Minikube applications.
# Microservices run locally now; Jenkins will deploy their k8s manifests later.
name: shared-infra

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      - postgres
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      # One issuer identity, even when a Pod uses the host-access token URL.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak/ecommerce-realm.json:/opt/keycloak/data/import/ecommerce-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      # Shared by IntelliJ (localhost) and Minikube (host.minikube.internal).
      - "6379:6379"
    # Development credential; also used by redis-cli and the health check.
    environment:
      REDISCLI_AUTH: "WorkoutsRedis-LocalStage-2026!"
    command: ["sh", "-c", 'exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDISCLI_AUTH"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro

  # Each application owns a separate database in the shared PostgreSQL instance.

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: unless-stopped
    ports:
      # PLAINTEXT_HOST — for processes running directly on the Mac
      # (mvn spring-boot:run), advertised as localhost.
      - "9092:9092"
      # PLAINTEXT_K8S — for pods running inside minikube, advertised as
      # host.minikube.internal. Two separate ports because Kafka clients
      # reconnect using whatever address the broker advertises after the
      # first handshake — one address can't be reachable from both
      # "outside on the Mac" and "inside a minikube Pod" at once.
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # The image declares a VOLUME at /var/lib/kafka/data, but its actual
      # default log.dirs is /tmp/kafka-logs — a different, undeclared,
      # ephemeral path. Without this override the mounted volume above is
      # never written to and all topic data is lost on every container
      # recreate.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # PLAINTEXT_DOCKER — for sibling containers on this compose network
      # (e.g. kafka-ui), advertised as the service name "kafka". Not
      # published to the host; only reachable from inside the compose network.
      KAFKA_LISTENERS: PLAINTEXT_HOST://:9092,PLAINTEXT_K8S://:9094,PLAINTEXT_DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_K8S://host.minikube.internal:9094,PLAINTEXT_DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_K8S:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_HOST
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: ci8CzldyQfKoDVpQ7YR2Vg

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

volumes:
  redis-data:
    name: workouts-redis-data
  postgres-data:
    name: workouts-postgres-data
    external: true
  kafka-data:
    name: workouts-kafka-data
    external: true
