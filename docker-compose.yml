# Infrastructure only: shared by IntelliJ and Minikube applications.
# Microservices run locally now; Jenkins will deploy their k8s manifests later.
name: shared-infra

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      - postgres
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      # One issuer identity, even when a Pod uses the host-access token URL.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak/ecommerce-realm.json:/opt/keycloak/data/import/ecommerce-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      # Shared by IntelliJ (localhost) and Minikube (host.minikube.internal).
      - "6379:6379"
    # Development credential; also used by redis-cli and the health check.
    environment:
      REDISCLI_AUTH: "WorkoutsRedis-LocalStage-2026!"
    command: ["sh", "-c", 'exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDISCLI_AUTH"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro

  # Each application owns a separate database in the shared PostgreSQL instance.

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: unless-stopped
    ports:
      # PLAINTEXT_HOST — for processes running directly on the Mac
      # (mvn spring-boot:run), advertised as localhost.
      - "9092:9092"
      # PLAINTEXT_K8S — for pods running inside minikube, advertised as
      # host.minikube.internal. Two separate ports because Kafka clients
      # reconnect using whatever address the broker advertises after the
      # first handshake — one address can't be reachable from both
      # "outside on the Mac" and "inside a minikube Pod" at once.
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # The image declares a VOLUME at /var/lib/kafka/data, but its actual
      # default log.dirs is /tmp/kafka-logs — a different, undeclared,
      # ephemeral path. Without this override the mounted volume above is
      # never written to and all topic data is lost on every container
      # recreate.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # PLAINTEXT_DOCKER — for sibling containers on this compose network
      # (e.g. kafka-ui), advertised as the service name "kafka". Not
      # published to the host; only reachable from inside the compose network.
      KAFKA_LISTENERS: PLAINTEXT_HOST://:9092,PLAINTEXT_K8S://:9094,PLAINTEXT_DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_K8S://host.minikube.internal:9094,PLAINTEXT_DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_K8S:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_HOST
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: ci8CzldyQfKoDVpQ7YR2Vg

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092


  # All observability backends belong to shared-infra; apps remain in IntelliJ/Minikube.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    restart: unless-stopped
    user: "0:0" # File-backed export queues live in this dedicated named volume.
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "4317:4317"
      - "4318:4318" # Also reachable by host.minikube.internal; trusted development network only.
      - "127.0.0.1:13133:13133"
    volumes:
      - ./docker/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
      - otel-data:/var/lib/otelcol
    depends_on: [tempo, loki]
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v3.8.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=2GB", "--enable-feature=exemplar-storage"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on: [otel-collector, alertmanager]

  loki:
    image: grafana/loki:3.6.3
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - ./docker/observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.9.0
    restart: unless-stopped
    user: "0:0" # Local filesystem backend on a dedicated named volume.
    command: ["-config.file=/etc/tempo/config.yml"]
    ports: ["127.0.0.1:3200:3200"]
    volumes:
      - ./docker/observability/tempo.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-WorkoutsGrafana-Local-2026!}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki, tempo]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./docker/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.18.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
    depends_on: [postgres]

  redis-exporter:
    image: oliver006/redis_exporter:v1.80.1
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: "WorkoutsRedis-LocalStage-2026!"
    depends_on: [redis]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    restart: unless-stopped
    command: ["--kafka.server=kafka:29092", "--kafka.version=3.8.0"]
    depends_on: [kafka]

volumes:
  redis-data:
    name: workouts-redis-data
  postgres-data:
    name: workouts-postgres-data
    external: true
  kafka-data:
    name: workouts-kafka-data
    external: true
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  otel-data:
  alertmanager-data:
